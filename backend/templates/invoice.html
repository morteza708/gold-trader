<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فاکتور فروش</title>
    <style>
        /* --- تنظیمات صفحه --- */
        @page {
            size: A5;
            margin: 10mm; /* حاشیه دور کاغذ */
        }

        * {
            box-sizing: border-box;
        }

        /* --- فونت‌ها --- */
        {% if font_base64 %}
        @font-face {
            font-family: 'IRANYekan';
            src: url('data:font/woff2;base64,{{ font_base64 }}') format('woff2');
            font-weight: normal;
        }
        @font-face {
            font-family: 'IRANYekan';
            src: url('data:font/woff2;base64,{{ font_base64 }}') format('woff2');
            font-weight: bold;
        }
        {% endif %}

        body {
            font-family: {% if font_base64 %}'IRANYekan'{% else %}Tahoma, Arial{% endif %}, sans-serif;
            direction: rtl;
            font-size: 10pt;
            color: #000;
            background: #fff;
            margin: 0;
            padding: 0;
            height: 100%;
        }

        /* --- کانتینر اصلی با چیدمان فلکس --- 
           این باعث می‌شود فوتر همیشه پایین بماند بدون تداخل
        */
        .main-border {
            border: 2px solid #000;
            padding: 10px;
            /* ارتفاع فیکس برای A5 منهای مارجین‌ها حدودی 185mm */
            min-height: 185mm; 
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        /* --- جداول --- */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td, th {
            padding: 5px;
            vertical-align: middle;
        }

        /* --- هدر --- */
        .header-section {
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .logo-img {
            height: 36px;
            width: auto;
            max-width: 48px;
            vertical-align: middle;
            display: inline-block;
        }

        .logo-placeholder {
            font-size: 24px;
            font-weight: 900;
            border: 2px solid #000;
            padding: 5px 15px;
            display: inline-block;
            border-radius: 5px;
            vertical-align: middle;
        }

        .company-name { font-size: 16px; font-weight: 900; margin-top: 5px;}
        .company-sub { font-size: 9px; color: #444; }

        .invoice-title {
            font-size: 18px;
            font-weight: 900;
            text-decoration: underline;
            margin-bottom: 5px;
        }
        .invoice-meta { font-size: 10pt; line-height: 1.5; font-weight: bold;}

        /* --- باکس‌های طرفین --- */
        .parties-table {
            border: 1px solid #000;
            margin-bottom: 15px;
        }
        .parties-table td {
            width: 50%;
            padding: 10px;
            vertical-align: top;
        }
        .parties-table td:first-child { border-left: 1px solid #000; }

        .p-label { font-size: 9pt; font-weight: bold; color: #555; margin-bottom: 5px; text-decoration: underline;}
        .p-name { font-size: 11pt; font-weight: 900; margin-bottom: 5px; }
        .p-info { font-size: 10pt; }

        /* --- جدول کالا --- */
        .items-table {
            border: 1px solid #000;
            margin-bottom: 15px;
        }
        .items-table th {
            background-color: #f0f0f0;
            border-bottom: 1px solid #000;
            border-left: 1px solid #000;
            font-weight: 900;
            font-size: 9pt;
            text-align: center;
            padding: 8px;
        }
        .items-table th:last-child { border-left: none; }

        .items-table td {
            border-bottom: 1px solid #ccc;
            border-left: 1px solid #000;
            text-align: center;
            padding: 8px;
            font-size: 10pt;
        }
        .items-table td:last-child { border-left: none; }

        .col-desc { width: 40%; text-align: right !important; font-weight: bold;}
        .col-karat { width: 10%; }
        .col-weight { width: 15%; }
        .col-price { width: 17.5%; }
        .col-total { width: 17.5%; font-weight: bold;}

        /* --- بخش جمع کل (اصلاح شده) --- */
        .summary-wrapper {
            width: 100%;
            margin-top: 10px;
        }
        
        .totals-table {
            width: 100%; /* جدول داخلی تمام عرض کانتینر خود را بگیرد */
            border: 2px solid #000;
        }
        
        .totals-table td {
            padding: 8px;
            border-bottom: 1px solid #000;
            /* جلوگیری از شکستن متن */
            white-space: nowrap; 
        }
        
        .t-label { text-align: right; font-weight: bold; width: 35%; background: #f0f0f0;}
        .t-value { text-align: left; font-weight: 900; width: 65%; padding-left: 10px;}
        
        .totals-table tr:last-child td { border-bottom: none; }

        /* --- بخش امضا و فوتر (Flex Item) --- */
        /* این دیو فضای خالی را پر می‌کند تا فوتر پایین برود */
        .spacer {
            flex-grow: 1; 
        }

        .sign-section {
            margin-top: 24px;
            /* تضمین فاصله مناسب از فوتر */
            margin-bottom: 16px;
            width: 100%;
        }

        .sign-box {
            text-align: center;
            font-weight: bold;
            font-size: 10pt;
            padding-bottom: 8px;
        }

        .sign-dash {
            border-top: 1px dashed #666;
            height: 28px;
            margin: 0 8px;
        }

        .stamp-img {
            max-height: 52px;
            max-width: 110px;
            display: block;
            margin: 4px auto 6px;
            object-fit: contain;
        }

        .footer {
            /* فوتر به عنوان آخرین آیتم فلکس */
            margin-top: auto;
            text-align: center;
            font-size: 8pt;
            border-top: 1px solid #000;
            padding-top: 8px;
            width: 100%;
        }

        .currency-unit {
            font-size: 8pt;
            font-weight: normal;
        }
</head>
<body>

    <div class="main-border">
        
        <!-- محتوای اصلی -->
        <div>
            <!-- هدر -->
            <table class="header-section">
                <tr>
                    <td style="width: 60%;">
                        {% if logo_base64 %}
                        <img class="logo-img" src="data:image/png;base64,{{ logo_base64 }}" alt="{{ brand_name|default:'لوگو' }}" />
                        {% else %}
                        <div class="logo-placeholder">{{ brand_initial|default:"G" }}</div>
                        {% endif %}
                        <div style="display: inline-block; vertical-align: middle; margin-right: 10px;">
                            <div class="company-name">{{ brand_name|default:"گلد تریدر" }}</div>
                            <div class="company-sub">{{ tagline }}</div>
                        </div>
                    </td>
                    <td style="width: 40%; text-align: left;">
                        <div class="invoice-title">فاکتور فروش</div>
                        <div class="invoice-meta">
                            شماره: {{ invoice_number }}<br>
                            تاریخ: {{ date }}<br>
                            ساعت: {{ time }}
                            {% if is_manual %}
                            <br><strong style="color:#92400e;">فاکتور دستی / حضوری</strong>
                            {% if settlement_mode_display %}<br>تسویه: {{ settlement_mode_display }}{% endif %}
                            {% if payment_status_display %}<br>پرداخت: {{ payment_status_display }}{% endif %}
                            {% endif %}
                        </div>
                    </td>
                </tr>
            </table>

            <!-- طرفین -->
            <table class="parties-table">
                <tr>
                    <td>
                        <div class="p-label">{{ seller_label }}:</div>
                        <div class="p-name">{{ seller_name }}</div>
                        <div class="p-info">شناسه/کد ملی: {{ seller_national_id }}</div>
                    </td>
                    <td>
                        <div class="p-label">{{ buyer_label }}:</div>
                        <div class="p-name">{{ buyer_name }}</div>
                        <div class="p-info">شماره تماس: {{ buyer_mobile }}</div>
                    </td>
                </tr>
            </table>

            <!-- اقلام -->
            <table class="items-table">
                <thead>
                    <tr>
                        <th class="col-desc">شرح کالا</th>
                        <th class="col-karat">عیار</th>
                        <th class="col-weight">وزن (g)</th>
                        <th class="col-price">فی واحد</th>
                        <th class="col-total">مبلغ کل</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="col-desc">{{ item_description }}</td>
                        <td class="col-karat">۷۵۰ (۱۸)</td>
                        <td class="col-weight">{{ amount }}</td>
                        <td class="col-price">{{ price }}</td>
                        <td class="col-total">{{ total }}</td>
                    </tr>
                    <!-- ردیف خالی -->
                    <tr style="height: 30px;">
                        <td style="border-left: 1px solid #000;"></td>
                        <td style="border-left: 1px solid #000;"></td>
                        <td style="border-left: 1px solid #000;"></td>
                        <td style="border-left: 1px solid #000;"></td>
                        <td></td>
                    </tr>
                </tbody>
            </table>

            {% if has_delivery_details %}
            <div style="border: 1px solid #000; padding: 8px; margin-bottom: 12px; font-size: 9pt;">
                <div style="font-weight: 900; margin-bottom: 6px; text-decoration: underline;">مشخصات تحویل فیزیکی</div>
                <table style="width:100%; border-collapse: collapse;">
                    <tr>
                        <td style="padding: 3px 0; width: 50%;">عیار واقعی: <strong>{{ delivery_actual_karat }}</strong></td>
                        <td style="padding: 3px 0;">وزن فیزیکی: <strong>{{ delivery_physical_weight }}</strong> گرم</td>
                    </tr>
                    <tr>
                        <td style="padding: 3px 0;">کد ریگیری/پاکت: <strong>{{ delivery_packet_code }}</strong></td>
                        <td style="padding: 3px 0;">سری: <strong>{{ delivery_seri }}</strong></td>
                    </tr>
                    <tr>
                        <td style="padding: 3px 0;" colspan="2">آزمایشگاه: <strong>{{ delivery_lab_name }}</strong></td>
                    </tr>
                    <tr>
                        <td style="padding: 3px 0;">مابه‌التفاوت: <strong>{{ delivery_difference_rial }}</strong> ریال</td>
                        <td style="padding: 3px 0;">نحوه تسویه: <strong>{{ delivery_difference_method_display }}</strong></td>
                    </tr>
                    <tr>
                        <td style="padding: 3px 0;" colspan="2">توضیحات: <strong>{{ delivery_notes }}</strong></td>
                    </tr>
                </table>
                <div style="margin-top: 6px; font-size: 8pt; color: #444;">
                    وزن دفتر پلتفرم بر اساس معادل عیار ۷۵۰ است؛ مشخصات بالا مربوط به تحویل فیزیکی است.
                </div>
            </div>
            {% endif %}

            <!-- جمع کل (اصلاح شده: افزایش عرض باکس) -->
            <table class="summary-wrapper">
                <tr>
                    <!-- عرض فضای خالی کاهش یافت (35%) -->
                    <td style="width: 35%;"></td> 
                    <!-- عرض باکس قیمت افزایش یافت (65%) -->
                    <td style="width: 65%; padding: 0;">
                        <table class="totals-table">
                            <tr>
                                <td class="t-label">جمع کل:</td>
                                <td class="t-value">{{ total }}</td>
                            </tr>
                            <tr>
                                <td class="t-label">مالیات:</td>
                                <td class="t-value">۰</td>
                            </tr>
                            <tr style="background-color: #e5e7eb;">
                                <td class="t-label" style="background-color: #d1d5db;">قابل پرداخت:</td>
                                <td class="t-value">{{ total }} <span class="currency-unit">ریال</span></td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>

            <!-- امضا: برچسب بالا، مهر/امضا، خط‌چین (قالب A5) -->
            <table class="sign-section">
                <tr>
                    <td style="width: 50%;">
                        <div class="sign-box">مهر و امضای فروشنده</div>
                        {% if stamp_base64 %}
                        <img class="stamp-img" src="data:image/png;base64,{{ stamp_base64 }}" alt="مهر / امضا" />
                        {% endif %}
                        <div class="sign-dash"></div>
                    </td>
                    <td style="width: 50%;">
                        <div class="sign-box">مهر و امضای خریدار</div>
                        <div class="sign-dash"></div>
                    </td>
                </tr>
            </table>
        </div>

        <!-- فوتر چسبان -->
        <div class="footer">
            {% if footer_text %}{{ footer_text }}{% else %}—{% endif %}
        </div>

    </div>

</body>
</html>

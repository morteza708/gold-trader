# Docker Compose Configuration for PRODUCTION
# استفاده: docker-compose -f docker-compose.production.yml up -d

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: gold_trading_db
    environment:
      POSTGRES_DB: ${DB_NAME:-gold_trading}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # در production پورت را expose نمی‌کنیم (فقط از طریق network)
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gold_trading_network
    restart: unless-stopped

  # Redis (for Celery and caching)
  redis:
    image: redis:7-alpine
    container_name: gold_trading_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # در production پورت را expose نمی‌کنیم (فقط از طریق network)
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gold_trading_network
    restart: unless-stopped

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gold_trading_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile - --error-logfile - config.wsgi:application"
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gold_trading_network
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://opalbox.ir/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://opalbox.ir}
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-اپال‌باکس}
        NEXT_PUBLIC_BRAND_NAME_EN: ${NEXT_PUBLIC_BRAND_NAME_EN:-OpalBox}
        NEXT_PUBLIC_BRAND_COMPANY_NAME: ${NEXT_PUBLIC_BRAND_COMPANY_NAME:-شرکت اپال‌باکس}
        NEXT_PUBLIC_BRAND_TAGLINE: ${NEXT_PUBLIC_BRAND_TAGLINE:-سامانه امن خرید و فروش طلای آب‌شده}
        NEXT_PUBLIC_BRAND_LOGO: ${NEXT_PUBLIC_BRAND_LOGO:-/OpalBox.png}
        NEXT_PUBLIC_BRAND_LOGO_MARK: ${NEXT_PUBLIC_BRAND_LOGO_MARK:-/OpalBox-mark.png}
        NEXT_PUBLIC_THEME_COLOR: ${NEXT_PUBLIC_THEME_COLOR:-#D4AF37}
    container_name: gold_trading_frontend
    # Note: No volume mount for /app in production to preserve standalone build
    volumes:
      - /app/node_modules
      - /app/.next
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://opalbox.ir/api}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://opalbox.ir}
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - gold_trading_network
    restart: unless-stopped

  # Celery Worker (for background tasks)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gold_trading_celery_worker
    command: celery -A config worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - gold_trading_network
    restart: unless-stopped

  # Celery Beat (for periodic tasks — price sync + limit orders)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gold_trading_celery_beat
    command: celery -A config beat --loglevel=info --scheduler=celery.beat:PersistentScheduler --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      celery_worker:
        condition: service_started
    networks:
      - gold_trading_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: gold_trading_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # قبل از SSL: nginx.production.http.conf | بعد از SSL: nginx.production.conf
      - ./nginx/nginx.production.http.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_static:/var/www/staticfiles:ro
      - backend_media:/var/www/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - gold_trading_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_static:
    driver: local
  backend_media:
    driver: local

networks:
  gold_trading_network:
    driver: bridge


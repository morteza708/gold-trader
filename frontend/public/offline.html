<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#D4AF37" />
  <title>آفلاین | اپال‌باکس</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Tahoma, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 360px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }
    h1 { font-size: 1.25rem; margin: 0 0 10px; }
    p { margin: 0 0 18px; color: #64748b; line-height: 1.7; font-size: 0.95rem; }
    button {
      border: 0;
      background: #D4AF37;
      color: #fff;
      font-weight: 700;
      border-radius: 14px;
      padding: 12px 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>برای ادامه کار با اپال‌باکس به اینترنت نیاز دارید. پس از اتصال دوباره تلاش کنید.</p>
    <button type="button" onclick="location.reload()">تلاش مجدد</button>
  </div>
</body>
</html>
